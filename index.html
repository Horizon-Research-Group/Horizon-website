<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon Research Group</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #e5e7eb;
        }

        .glow-on-hover {
            transition: all 0.3s ease-in-out;
            box-shadow: 0 0 5px rgba(0, 191, 255, 0);
        }

        .glow-on-hover:hover {
            color: #ffffff;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.6), 0 0 25px rgba(0, 191, 255, 0.4);
        }

        .icon-glow-on-hover svg {
            transition: all 0.3s ease-in-out;
            filter: drop-shadow(0 0 3px rgba(0, 191, 255, 0));
        }

        .icon-glow-on-hover:hover svg {
            filter: drop-shadow(0 0 8px rgba(0, 191, 255, 0.7));
        }

        .header-glass {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: rgba(10, 10, 10, 0.7);
        }

        img{
            width: 15vh;
        }

    </style>
</head>
<body class="antialiased">

    <!-- Fixed Headers -->
    <header class="fixed top-0 left-0 right-0 z-50 header-glass border-b border-gray-800">
        <div class="container mx-auto px-6 py-4">
            <h1 class="text-xl md:text-2xl font-bold text-white tracking-wider">
                <img src="horzion_logo-removebg-preview (1).png" alt="">
            </h1>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex items-center justify-center min-h-screen">
        <div class="container mx-auto px-6 mt-24 relative z-10">

            <!-- Particle container -->
            <div id="particle-container" class="absolute top-0 left-0 w-full h-full -z-10 overflow-hidden"></div>

            <div class="max-w-3xl mx-auto text-center">
                
                <!-- Introduction Section -->
                <section id="intro" class="mb-16">
                    <h2 class="text-4xl md:text-5xl font-extrabold text-white mb-4">
                        Exploring the Frontiers of Knowledge
                    </h2>
                    <p class="text-lg md:text-xl text-gray-400 max-w-2xl mx-auto">
                        Horizon Research Group unites passionate innovators to push tech boundaries, solve real-world problems, and inspire the next generation of researchers.
                    </p>
                </section>

                <!-- Links Section -->
                <section id="links">
                    <div class="flex flex-col sm:flex-row justify-center items-center gap-6">
                        
                        <!-- LinkedIn Link -->
                        <a href="https://www.linkedin.com/company/horizon-mjcet/" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto flex items-center justify-center gap-3 px-6 py-3 bg-gray-900 border border-gray-700 rounded-lg text-lg font-semibold text-gray-200 glow-on-hover icon-glow-on-hover">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-cyan-400"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>
                            <span>LinkedIn Profile</span>
                        </a>

                        <!-- TJI Group Link -->
                        <a href="https://chat.whatsapp.com/DjByoP7h85ZG6aEl13Xefk?mode=ac_t" class="w-full sm:w-auto flex items-center justify-center gap-3 px-6 py-3 bg-cyan-600/90 border border-cyan-500 rounded-lg text-lg font-semibold text-white glow-on-hover icon-glow-on-hover" style="box-shadow: 0 0 15px rgba(0, 191, 255, 0.3);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-white"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="17" y1="11" x2="23" y2="11"></line></svg>
                            <span>Join TJI Group</span>
                        </a>

                         <!-- Instagram Links -->
                        <a href="https://www.instagram.com/horizon.mjcet/" target="_blank"
                            rel="noopener noreferrer"
                            class="w-full sm:w-auto flex items-center justify-center gap-3 px-6 py-3 bg-pink-600/90 border border-pink-500 rounded-lg text-lg font-semibold text-white glow-on-hover icon-glow-on-hover"
                            style="box-shadow: 0 0 15px rgba(225, 48, 108, 0.4);">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="text-white">
                                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                            </svg>
                            <span>Instagram</span>
                        </a>

                    </div>
                </section>

            </div>
        </div>
    </main>

    <!-- Particle Animation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const particleContainer = document.getElementById('particle-container');
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                const size = Math.random() * 3 + 1;
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const duration = Math.random() * 20 + 15;
                const delay = Math.random() * 10;
                const moveX = (Math.random() - 0.5) * 20;
                const moveY = (Math.random() - 0.5) * 20;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.position = 'absolute';
                particle.style.backgroundColor = 'rgba(0, 191, 255, 0.5)';
                particle.style.borderRadius = '50%';
                particle.style.left = `${x}vw`;
                particle.style.top = `${y}vh`;

                const animationName = `float-${i}`;
                particle.style.animation = `${animationName} ${duration}s linear ${delay}s infinite`;

                const styleSheet = document.createElement("style");
                styleSheet.textContent = `
                    @keyframes ${animationName} {
                        0% { transform: translate(0, 0); opacity: 0; }
                        50% { opacity: 0.7; }
                        100% { transform: translate(${moveX}vw, ${moveY}vh); opacity: 0; }
                    }
                `;
                document.head.appendChild(styleSheet);

                particleContainer.appendChild(particle);
            }
        });
    </script>

</body>
</html>
